services:
  flask_app:
    build: .

    container_name: flaskv1

    expose:
      - "5000"

  nginx:
    build: ./nginx

    container_name: nginxv1

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./static:/usr/share/nginx/html/static
      - /etc/letsencrypt:/etc/letsencrypt

    depends_on:
      - flask_app
