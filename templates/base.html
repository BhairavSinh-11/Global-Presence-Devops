<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <!-- SEO Meta Tags -->
    <title>{% block title %}Global Presence - Complete Immigration & Visa Solutions{% endblock %}</title>
    <meta name="description" content="{% block description %}Global Presence is a premium immigration and visa consultancy in Chandigarh, India. Specializing in Australia Skilled Migration, Canada Express Entry, Student, Tourist, and Spouse Visas.{% endblock %}">
    <meta name="author" content="Global Presence Consulting Group">
    
    <!-- Open Graph (OG) Meta Tags for Social Sharing -->
    <meta property="og:title" content="Global Presence - Immigration & Visa Consultancy">
    <meta property="og:description" content="Specialized advisors for Australia Subclass 491, Canada PNP, Spouse & Student Visas. Migrate to your dream destination with registered migration experts.">
    <meta property="og:type" content="website">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Header Navigation -->
    {% include 'components/navbar.html' %}

    <!-- Main Content Container -->
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include 'components/footer.html' %}

    <!-- Custom Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
